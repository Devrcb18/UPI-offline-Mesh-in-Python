<!DOCTYPE html>
<html>
<head>
    <title>Offline UPI Mesh - Sender</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            background-color: #f0f2f5;
            color: #333333;
            margin: 0;
            padding: 0;
        }
        #wrapper {
            width: 100%;
            max-width: 480px;
            margin: 30px auto;
            background-color: #ffffff;
            border: 1px solid #d0d0d0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-radius: 6px;
            overflow: hidden;
        }
        #header {
            background-color: #1a3a5c;
            color: #ffffff;
            padding: 20px 24px;
            text-align: center;
        }
        #header h1 { margin: 0; font-size: 22px; font-weight: 600; }
        #header p { margin: 6px 0 0 0; font-size: 13px; color: #a8c0d8; }
        #content { padding: 24px; }
        .section {
            border: 1px solid #e0e0e0;
            background-color: #fafafa;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 4px;
        }
        .section h2 {
            margin: 0 0 16px 0; font-size: 17px; color: #1a3a5c;
            border-bottom: 1px solid #e0e0e0; padding-bottom: 8px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; font-weight: 600; color: #444; margin-bottom: 6px; font-size: 13px;
        }
        .form-group select, .form-group input {
            width: 100%; padding: 12px; font-size: 14px;
            border: 1px solid #c0c0c0; border-radius: 4px;
            background-color: #fff; box-sizing: border-box;
        }
        .form-group select:focus, .form-group input:focus {
            outline: none; border-color: #1a3a5c;
        }
        button {
            width: 100%; padding: 14px; font-size: 15px; font-weight: 600;
            border: none; border-radius: 4px; cursor: pointer;
            background-color: #1a3a5c; color: #fff;
        }
        button:hover { background-color: #224a7a; }
        button:disabled { background-color: #b0c4de; cursor: default; }
        .qr-section {
            text-align: center; padding: 16px 0;
        }
        .qr-section h3 { margin: 0 0 12px 0; font-size: 15px; color: #333; }
        #qrImg {
            width: 100%; max-width: 380px; height: auto; border: 1px solid #e0e0e0;
            border-radius: 4px; background: #fff; image-rendering: pixelated;
        }
        .qr-data {
            margin-top: 16px; padding: 12px; background: #f5f5f5;
            border: 1px solid #e0e0e0; border-radius: 4px;
            font-family: "Consolas", monospace; font-size: 11px;
            word-break: break-all; max-height: 120px; overflow: auto;
        }
        .btn-copy {
            margin-top: 12px; background-color: #206020;
        }
        .btn-copy:hover { background-color: #287028; }
        .success-msg {
            background: #e8f5e8; border: 1px solid #b0d8b0; color: #1a6b1a;
            padding: 12px; border-radius: 4px; margin-bottom: 16px; text-align: center;
        }
        .error-msg {
            background: #fdeaea; border: 1px solid #e8b0b0; color: #b02020;
            padding: 12px; border-radius: 4px; margin-bottom: 16px; text-align: center;
        }
        .info-note {
            background: #eef5ff; border: 1px solid #c0d8f0; color: #1a3a5c;
            padding: 12px; border-radius: 4px; margin-bottom: 16px; font-size: 13px;
            text-align: center;
        }
        #footer {
            background-color: #f5f5f5; border-top: 1px solid #e0e0e0;
            padding: 12px 24px; font-size: 11px; color: #888; text-align: center;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div id="wrapper">
    <div id="header">
        <h1>Offline UPI Mesh</h1>
        <p>Create Offline Payment — Generate QR Code</p>
    </div>

    <div id="content">
        <div class="info-note">
            This page runs on the host laptop. Open it on Mobile A's browser via the host's LAN IP (e.g., http://192.168.x.x:8000/sender).
        </div>

        <div id="errorMsg" class="error-msg hidden"></div>
        <div id="successMsg" class="success-msg hidden"></div>

        <div class="section">
            <h2>Payment Details</h2>
            <form id="paymentForm">
                <div class="form-group">
                    <label for="sender">Sender</label>
                    <select name="sender" id="sender" required>
                        {% for acc in accounts %}
                        <option value="{{ acc.vpa }}">{{ acc.vpa }} (Rs.{{ "%.2f"|format(acc.balance) }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="receiver">Receiver</label>
                    <select name="receiver" id="receiver" required>
                        {% for acc in accounts %}
                        <option value="{{ acc.vpa }}">{{ acc.vpa }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="amount">Amount (Rs.)</label>
                    <input type="number" name="amount" id="amount" step="0.01" min="0.01" required value="100">
                </div>
                <button type="submit" id="submitBtn">Generate QR Code</button>
            </form>
        </div>

        <div class="section hidden" id="qrSection">
            <h2>QR Code</h2>
            <div class="qr-section">
                <h3>Scan with Host Laptop</h3>
                <img id="qrImg" alt="Payment QR code">
                <div class="qr-data" id="qrData"></div>
                <button class="btn-copy" onclick="copyQrData()">Copy QR Data</button>
            </div>
        </div>
    </div>

    <div id="footer">
        Offline UPI Mesh Sender — Works offline after QR is generated
    </div>
</div>

<script>
    document.getElementById('paymentForm').onsubmit = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const errDiv = document.getElementById('errorMsg');
        const succDiv = document.getElementById('successMsg');
        errDiv.classList.add('hidden');
        succDiv.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = 'Generating...';

        const form = new FormData(e.target);
        try {
            const res = await fetch('/create', { method: 'POST', body: form });
            const data = await res.json();
            if (data.status === 'created') {
                showQr(data.qr_data, data.qr_png);
                succDiv.textContent = 'QR code generated. Increase screen brightness and hold it steady in front of the host camera.';
                succDiv.classList.remove('hidden');
            } else {
                throw new Error(data.message || 'Failed to create packet');
            }
        } catch (err) {
            errDiv.textContent = 'Error: ' + err.message;
            errDiv.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Generate QR Code';
        }
    };

    function showQr(qrData, qrPng) {
        document.getElementById('qrSection').classList.remove('hidden');
        document.getElementById('qrImg').src = qrPng;   // QR is rendered server-side
        document.getElementById('qrData').textContent = qrData;
        window.currentQrData = qrData;
    }

    function copyQrData() {
        if (!window.currentQrData) return;
        navigator.clipboard.writeText(window.currentQrData).then(() => {
            alert('Copied to clipboard');
        });
    }
</script>
</body>
</html>
